name: CI

# Two jobs, deliberately split.
#
# `unit-tests` runs the 433 tests that now live in Packages/SpeakLifeKit. It
# opens no Xcode project, builds no .app, boots no simulator, and resolves no
# remote packages — SpeakLifeKit declares none. That is the whole point of the
# extraction: a red result means the code, not the SDK stack, the simulator, the
# network or the runner image.
#
# `app-tests` still builds the application and runs what is left in
# SpeakLifeTests — the Firestore-bound files that cannot leave an app host. It is
# the slow one, and it exists so a PR cannot break the app while the fast job
# stays green.
#
# Before any of this the repository had no build CI at all: every pull request
# reported zero checks and the branch protection rule sat waiting on a status
# that nothing ever posted. Merges went through on override.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # So a run can be kicked off by hand from the Actions tab.
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. Cancelling it
# keeps the queue short — macOS runners are the slowest and scarcest kind.
# main is exempt: those runs are the record of what actually landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The fast one. This is the check that should gate pull requests.
  # ───────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    # Xcode is still required even though no Xcode project is opened: the
    # SpeakLifePersistence target compiles SpeakLife.xcdatamodeld through a
    # SwiftPM prebuild plugin that shells out to `xcrun momc`, and momc ships
    # inside Xcode rather than the Command Line Tools.
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          xcrun --find momc

      # The package tests decode the real shipped content, which means a copy
      # of it lives under Tests/.../Resources. A copy is a liability: CLAUDE.md
      # sends declaration edits to the app's file, and nothing would stop the
      # test copy going stale and quietly guarding last month's content. This
      # step makes that drift a red build instead of a silent one.
      #
      # SwiftPM cannot reference resources outside a target's own directory, so
      # the duplicate is structural for now. Owning the content in the package
      # and having the app read it from there is the real fix.
      - name: Content copies match the app
        run: |
          set -e
          for name in declarationsv10 devotionals; do
            app="SpeakLife/SpeakLife/Preview Content/AffirmationData/$name.json"
            pkg="Packages/SpeakLifeKit/Tests/SpeakLifeCoreTests/Resources/$name.json"
            if ! cmp -s "$app" "$pkg"; then
              echo "::error::$name.json has drifted. The app's copy is canonical:"
              echo "::error::  cp \"$app\" \"$pkg\""
              exit 1
            fi
          done
          echo "content copies match"

      - name: swift test
        run: |
          set -o pipefail
          # If the momc prebuild plugin is ever refused by the SwiftPM sandbox,
          # the fix is --disable-sandbox here, not moving the model back to a
          # `.process` resource — that route silently copies the .xcdatamodeld
          # uncompiled and every Core Data test dies in setUp.
          #
          # Deliberately NOT --parallel. SwiftPM runs cases in separate
          # processes, and this suite still shares process-external state: one
          # `UserDefaults.standard` and one SQLite store under the runner's
          # home. Suites like StreakDisplayTests already save and restore the
          # BurstCompletionTracker singleton around each test, but that is
          # in-process bookkeeping and cannot survive a second process writing
          # the same defaults. Run 30 showed it plainly — several processes
          # logging the same store UUID with escalating history tokens, and
          # streaks off by one in both directions.
          #
          # The app-hosted suite never hit this because every run got a fresh
          # simulator container. On macOS the home directory is real and
          # persists. Serial is correct until the state is injected per test
          # (see docs/CLEANUP_AND_HARDENING_PLAN.md §8); the whole suite is
          # seconds either way, so this costs nothing today.
          swift test --package-path Packages/SpeakLifeKit

  # ───────────────────────────────────────────────────────────────────────────
  # The Cloud Functions. Runs on Linux in seconds, and exists because the
  # backend had no test gate at all before gift subscriptions: a function that
  # mints things worth money should not be the first place a bug is found in
  # production. Covers the pure logic in functions/giftingCore.js; the handlers
  # themselves are exercised against the emulator by hand.
  # ───────────────────────────────────────────────────────────────────────────
  functions-tests:
    name: Cloud Functions unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # `npm ci` rather than `npm install`, so a drifted lockfile fails the
      # build instead of being silently rewritten.
      - name: npm ci
        working-directory: functions
        run: npm ci

      - name: npm test
        working-directory: functions
        run: npm test

  # ───────────────────────────────────────────────────────────────────────────
  # The slow one. Proves the app still compiles and runs the residual
  # app-hosted tests.
  # ───────────────────────────────────────────────────────────────────────────
  app-tests:
    name: App build and hosted tests
    # macos-26, for the iOS 26 SDK. VoiceInputManager.swift calls SpeechAnalyzer,
    # SpeechTranscriber and AssetInventory. They are correctly runtime-gated with
    # @available(iOS 26.0, *), but an @available guard still needs the SDK at
    # compile time, so an older Xcode fails with four "cannot find ... in scope"
    # errors that look like missing code rather than a missing SDK.
    runs-on: macos-26
    timeout-minutes: 45

    env:
      PROJECT: SpeakLife/SpeakLife.xcodeproj
      SCHEME: SpeakLife
      DERIVED_DATA: DerivedData

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR is too old. The app compiles against the iOS 26 SDK \
          (SpeechAnalyzer, SpeechTranscriber, AssetInventory in VoiceInputManager.swift). \
          Installed: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

      # The dependency graph is six remote packages including firebase-ios-sdk,
      # which is enormous. Package.resolved is committed, so it is an exact key:
      # a cache hit means the same revisions, never a stale or drifting set.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Resolved as its own step so a dependency or network failure reads as
      # exactly that, instead of surfacing as a compile error hundreds of lines
      # into a build log.
      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      # Chosen at runtime rather than hardcoded. Device names come and go between
      # runner images, and a hardcoded "iPhone 16" turns into a red build the week
      # the image drops it — a CI failure that says nothing about the code is
      # worse than no CI, because people learn to ignore it.
      - name: Select a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS"))
                      | .value[]
                      | select(.name | startswith("iPhone"))] | last')
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "null" ]; then
            echo "No iOS iPhone simulator available on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $(echo "$DEVICE" | jq -r .name)"
          echo "SIMULATOR_ID=$(echo "$DEVICE" | jq -r .udid)" >> "$GITHUB_ENV"

      # Signing is deliberately NOT disabled.
      #
      # CODE_SIGNING_ALLOWED=NO looks like the safe choice for a machine with no
      # certificates, but it strips the entitlements along with the signature.
      # This app declares an iCloud container, and PersistenceController builds an
      # NSPersistentCloudKitContainer against it and calls fatalError if the store
      # will not load. Without the entitlement the container cannot resolve, so
      # the host app traps on launch and the whole run dies as "Early unexpected
      # exit ... signal trap before establishing connection" — a message that says
      # nothing about entitlements and reads like the app is simply broken.
      #
      # A simulator build needs no certificate and no provisioning profile: Xcode
      # signs it ad hoc and, crucially, applies the entitlements.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath TestResults.xcresult

      # Print WHY, not just that. Under parallel testing xcodebuild streams only
      # "Test case 'X' failed", with the assertion messages left behind in the
      # .xcresult — a bundle large enough that reading it means downloading an
      # artifact, which is a slow loop when the whole point is finding out what
      # broke.
      - name: Summarise test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult --format json 2>/dev/null \
            | jq -r '"\(.failedTests) failed, \(.passedTests) passed, \(.skippedTests) skipped\n",
                     (.testFailures[]? | "✗ \(.testName)\n    \(.failureText // "no message")")' \
            || echo "xcresulttool summary unavailable on this Xcode; see the uploaded artifact"

      # Only on failure. Uploading ~114 MB on every green run was pure cost.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
