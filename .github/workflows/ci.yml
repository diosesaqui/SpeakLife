name: CI

# Builds the app and runs the test suite on every pull request into main, and
# on main itself after a merge.
#
# Before this existed the repository had no build CI at all: the only workflow
# was GitHub's generated Pages deploy, every pull request reported zero checks,
# and the branch protection rule sat waiting on a status that nothing ever
# posted. Merges went through on override, and nothing had compiled the app or
# executed a single test.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # So a run can be kicked off by hand from the Actions tab.
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. Cancelling it
# keeps the queue short — macOS runners are the slowest and scarcest kind.
# main is exempt: those runs are the record of what actually landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and test
    # macos-26, for the iOS 26 SDK. VoiceInputManager.swift calls SpeechAnalyzer,
    # SpeechTranscriber and AssetInventory. They are correctly runtime-gated with
    # @available(iOS 26.0, *), but an @available guard still needs the SDK at
    # compile time, so an older Xcode fails with four "cannot find ... in scope"
    # errors that look like missing code rather than a missing SDK. macos-15
    # (Xcode 16) hit exactly that.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT: SpeakLife/SpeakLife.xcodeproj
      SCHEME: SpeakLife
      DERIVED_DATA: DerivedData

    steps:
      - uses: actions/checkout@v4

      # Images can carry several Xcodes and default to an older one, so the
      # newest is selected rather than assumed. The version floor is checked
      # here on purpose: without it, too old an Xcode surfaces as unresolved
      # Speech symbols hundreds of lines into a build log, which reads like
      # broken code and sends you looking in the wrong place.
      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR is too old. The app compiles against the iOS 26 SDK \
          (SpeechAnalyzer, SpeechTranscriber, AssetInventory in VoiceInputManager.swift). \
          Installed: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcrun simctl list runtimes | grep iOS || true

      # The dependency graph is six remote packages including firebase-ios-sdk,
      # which is enormous. Checking the resolved sources out from scratch on
      # every run is most of the wall clock. Package.resolved is committed, so
      # it is an exact key: a cache hit means the same revisions, never a stale
      # or drifting set.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Resolved as its own step so a dependency or network failure reads as
      # exactly that, instead of surfacing as a compile error hundreds of lines
      # into a build log.
      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      # Chosen at runtime rather than hardcoded. Device names come and go
      # between runner images, and a hardcoded "iPhone 16" turns into a red
      # build the week the image drops it — a CI failure that says nothing
      # about the code is worse than no CI, because people learn to ignore it.
      - name: Select a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS"))
                      | .value[]
                      | select(.name | startswith("iPhone"))] | last')
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "null" ]; then
            echo "No iOS iPhone simulator available on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $(echo "$DEVICE" | jq -r .name)"
          echo "SIMULATOR_ID=$(echo "$DEVICE" | jq -r .udid)" >> "$GITHUB_ENV"

      # Signing is deliberately NOT disabled.
      #
      # CODE_SIGNING_ALLOWED=NO looks like the safe choice for a machine with no
      # certificates, but it strips the entitlements along with the signature.
      # This app declares an iCloud container, and PersistenceController builds
      # an NSPersistentCloudKitContainer against it and calls fatalError if the
      # store will not load. Without the entitlement the container cannot
      # resolve, so the host app traps on launch and the whole run dies as
      # "Early unexpected exit ... signal trap before establishing connection" —
      # a message that says nothing about entitlements and reads like the app is
      # simply broken.
      #
      # A simulator build needs no certificate and no provisioning profile:
      # Xcode signs it ad hoc and, crucially, applies the entitlements. So the
      # correct move is to leave signing alone.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath TestResults.xcresult

      # Print WHY, not just that.
      #
      # Under parallel testing xcodebuild streams only "Test case 'X' failed",
      # with the assertion messages left behind in the .xcresult. That bundle is
      # over 100 MB here, so reading it means downloading an artifact — which is
      # a slow loop when the whole point is to find out what broke. Summarising
      # it into the log turns each red build into something diagnosable on
      # sight.
      - name: Summarise test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult --format json 2>/dev/null \
            | jq -r '"\(.failedTests) failed, \(.passedTests) passed, \(.skippedTests) skipped\n",
                     (.testFailures[]? | "✗ \(.testName)\n    \(.failureText // "no message")")' \
            || echo "xcresulttool summary unavailable on this Xcode; see the uploaded artifact"

      # The .xcresult holds the per-test failure messages and any crash logs,
      # which is the difference between "a test failed" and knowing which
      # assertion on which line.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore
