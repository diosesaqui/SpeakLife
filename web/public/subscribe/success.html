<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're in — SpeakLife</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
      min-height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.7); font-size: 17px; line-height: 1.6; margin-bottom: 32px; }
    .open-app {
      background: #a78bfa;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .note { color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <div>
    <div class="icon">🙏</div>
    <h1>You're in, Prayer Warrior.</h1>
    <p>Your SpeakLife Premium access is active.<br/>Open the app and start declaring.</p>
    <a class="open-app" href="speaklife://subscribe/success">Open SpeakLife</a>
    <p class="note">If the app doesn't open automatically, launch it from your home screen.</p>
  </div>
</body>
</html>
